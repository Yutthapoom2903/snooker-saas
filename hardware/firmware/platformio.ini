; Snooker table device firmware (ESP32 DevKit V1 / ESP32-WROOM-32)
;
; Two builds share src/common/:
;   pio run -e esp32dev          -> production firmware  (src/app_main.cpp)
;   pio run -e hwtest            -> bring-up / hardware test (src/app_hwtest.cpp)
;
; Flash:   pio run -e esp32dev -t upload
; Monitor: pio device monitor        (115200 baud)

[platformio]
default_envs = esp32dev

[common]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    majicdesigns/MD_MAX72XX@^3.5.1
    majicdesigns/MD_Parola@^3.7.3
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Production firmware implementing docs/mqtt-contract.md
[env:esp32dev]
extends = common
build_src_filter = +<*> -<app_hwtest.cpp>

; Hardware bring-up firmware (Serial menu at 115200)
[env:hwtest]
extends = common
build_src_filter = +<*> -<app_main.cpp>
